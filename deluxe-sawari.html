    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }

  #bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      rgba(8, 6, 20, 0.18) 0%,
      rgba(8, 6, 20, 0.05) 40%,
      rgba(8, 6, 20, 0.45) 100%
    );
  }

  /* Clock */
  #datetime {
    position: absolute;
    top: 28px;
    left: 32px;
    z-index: 2;
    text-shadow: 0 2px 14px rgba(0,0,0,0.55);
    user-select: none;
  }

  #datetime .time {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 300;
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  #datetime .date {
    font-size: 0.95rem;
    opacity: 0.8;
    margin-top: 4px;
    font-weight: 400;
    letter-spacing: 0.02em;
  }

  /* Brand */
  .brand {
    position: absolute;
    top: 28px;
    right: 32px;
    z-index: 2;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }

  /* Player dock */
  .player {
    position: absolute;
    left: 50%;
    bottom: 36px;
    z-index: 2;
    transform: translateX(-50%);
    width: min(640px, calc(100% - 40px));
    padding: 18px 22px 16px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    box-shadow:
      0 14px 44px rgba(0,0,0,0.48),
      inset 0 1px 0 rgba(255,255,255,0.07);
  }

  .song-meta {
    text-align: center;
    margin-bottom: 14px;
    min-height: 42px;
  }

  #songTitle {
    font-size: 1.05rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 8px;
  }

  #status {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 3px;
    min-height: 1em;
  }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  #timeCur, #timeDur {
    font-size: 0.72rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-width: 36px;
  }

  #timeDur { text-align: right; }

  .progress-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 99px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #9b7bff);
    border-radius: 99px;
    transition: width 0.15s linear;
    position: relative;
  }

  .progress-fill::after {
    content: "";
    position: absolute;
    right: -5px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(196,161,255,0.75);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .progress-track:hover .progress-fill::after {
    opacity: 1;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background 0.15s, transform 0.12s;
  }

  .btn:hover {
    background: rgba(255,255,255,0.1);
  }

  .btn:active {
    transform: scale(0.92);
  }

  .btn svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  .btn-play {
    width: 56px;
    height: 56px;
    background: var(--accent-soft);
    border: 1px solid rgba(196,161,255,0.38);
  }

  .btn-play:hover {
    background: rgba(196,161,255,0.42);
  }

  .btn-play svg {
    width: 26px;
    height: 26px;
  }

  /* Volume */
  .vol-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: 12px;
    width: 100px;
  }

  .vol-wrap svg {
    width: 18px;
    height: 18px;
    fill: var(--muted);
    flex-shrink: 0;
  }

  #volSlider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    background: rgba(255,255,255,0.15);
    border-radius: 99px;
    outline: none;
    cursor: pointer;
  }

  #volSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 6px rgba(0,0,0,0.3);
  }

  /* Hidden YT player */
  #yt-player-wrap {
    position: absolute;
    width: 2px;
    height: 2px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }

  @media (max-width: 520px) {
    #datetime { top: 18px; left: 18px; }
    .brand { top: 18px; right: 18px; font-size: 0.7rem; }
    .player { bottom: 20px; padding: 14px 16px 12px; }
    .vol-wrap { display: none; }
    .btn { width: 40px; height: 40px; }
    .btn-play { width: 50px; height: 50px; }
  }
</style>
</head>
<body>

  <div id="bg"></div>

  <div id="datetime">
    <div class="time" id="timeNow">--:--</div>
    <div class="date" id="dateNow">—</div>
  </div>

  <div class="brand">Deluxe Sawari</div>

  <div class="player">
    <div class="song-meta">
      <div id="songTitle">Tap play to start</div>
      <div id="status"></div>
    </div>

    <div class="progress-row">
      <span id="timeCur">0:00</span>
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span id="timeDur">0:00</span>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" title="Previous" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>

      <button class="btn btn-play" id="playBtn" title="Play / Pause" aria-label="Play">
        <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg id="iconPause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
      </button>

      <button class="btn" id="nextBtn" title="Next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <div class="vol-wrap">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" id="volSlider" min="0" max="100" value="80" aria-label="Volume">
      </div>
    </div>
  </div>

  <div id="yt-player-wrap"><div id="yt-player"></div></div>

<script>
  // ---- Clock ----
  function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    document.getElementById('timeNow').textContent = h + ':' + m;
    const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    document.getElementById('dateNow').textContent =
      days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---- YouTube player ----
  const PLAYLIST_ID = 'PLfJBvoNea3pG2nPyk4yKH93bZ6Y1XfiCm'; // Nepali Old Songs

  let player = null;
  let isReady = false;
  let isPlaying = false;
  let pollTimer = null;
  let seeking = false;

  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const songTitle = document.getElementById('songTitle');
  const status = document.getElementById('status');
  const timeCur = document.getElementById('timeCur');
  const timeDur = document.getElementById('timeDur');
  const progressTrack = document.getElementById('progressTrack');
  const progressFill = document.getElementById('progressFill');
  const volSlider = document.getElementById('volSlider');

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function setPlayingUI(playing) {
    isPlaying = playing;
    iconPlay.style.display = playing ? 'none' : 'block';
    iconPause.style.display = playing ? 'block' : 'none';
  }

  function startPoll() {
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (!player || !player.getCurrentTime || seeking) return;
      const cur = player.getCurrentTime() || 0;
      const dur = player.getDuration() || 0;
      timeCur.textContent = fmt(cur);
      timeDur.textContent = fmt(dur);
      if (dur > 0) {
        progressFill.style.width = ((cur / dur) * 100) + '%';
      }
    }, 400);
  }

  function updateTitle() {
    try {
      const data = player.getVideoData();
      songTitle.textContent = data.title || 'Playing…';
    } catch (e) {
      songTitle.textContent = 'Playing…';
    }
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player('yt-player', {
      height: '2',
      width: '2',
      playerVars: {
        listType: 'playlist',
        list: PLAYLIST_ID,
        autoplay: 0,
        controls: 0,
        modestbranding: 1,
        rel: 0
      },
      events: {
        onReady: function () {
          isReady = true;
          status.textContent = 'Ready · Nepali Old Songs';
          player.setVolume(Number(volSlider.value));
          startPoll();
        },
        onStateChange: function (e) {
          if (e.data === YT.PlayerState.PLAYING) {
            setPlayingUI(true);
            status.textContent = '';
            updateTitle();
          } else if (e.data === YT.PlayerState.PAUSED) {
            setPlayingUI(false);
          } else if (e.data === YT.PlayerState.ENDED) {
            setPlayingUI(false);
          } else if (e.data === YT.PlayerState.BUFFERING) {
            status.textContent = 'Buffering…';
          }
        },
        onError: function () {
          status.textContent = 'Skipping unavailable track…';
          setTimeout(() => {
            if (player && player.nextVideo) player.nextVideo();
          }, 600);
        }
      }
    });
  };

  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.body.appendChild(tag);

  // Play / Pause
  playBtn.addEventListener('click', () => {
    if (!isReady) {
      status.textContent = 'Loading player…';
      return;
    }
    if (isPlaying) {
      player.pauseVideo();
    } else {
      player.playVideo();
    }
  });

  // Prev / Next
  prevBtn.addEventListener('click', () => {
    if (!isReady) return;
    player.previousVideo();
    status.textContent = '';
  });

  nextBtn.addEventListener('click', () => {
    if (!isReady) return;
    player.nextVideo();
    status.textContent = '';
  });

  // Seek on progress bar click
  progressTrack.addEventListener('click', (e) => {
    if (!isReady || !player.getDuration) return;
    const rect = progressTrack.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    const dur = player.getDuration() || 0;
    if (dur > 0) {
      seeking = true;
      player.seekTo(ratio * dur, true);
      progressFill.style.width = (ratio * 100) + '%';
      setTimeout(() => { seeking = false; }, 300);
    }
  });

  // Volume
  volSlider.addEventListener('input', () => {
    if (player && player.setVolume) {
      player.setVolume(Number(volSlider.value));
    }
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (!isReady) return;
    if (e.code === 'Space') {
      e.preventDefault();
      playBtn.click();
    } else if (e.code === 'ArrowRight') {
      nextBtn.click();
    } else if (e.code === 'ArrowLeft') {
      prevBtn.click();
    }
  });
</script>

</body>
</html>
